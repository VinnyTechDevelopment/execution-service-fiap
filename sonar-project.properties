# SonarCloud — organização VinnyTechDevelopment
sonar.organization=vinnytechdevelopment
sonar.projectKey=VinnyTechDevelopment_execution-service-fiap
sonar.projectName=execution-service

# O SonarCloud passou a ignorar sonar.sources/sonar.tests e analisa o projeto
# inteiro: testes, migrations e scripts não podem contar como código sem cobertura.
sonar.test.inclusions=tests/**,features/**
sonar.coverage.exclusions=tests/**,features/**,database/**,scripts/**,config/**,routes/**,bootstrap/**,public/**,resources/**,behat.php,artisan
sonar.cpd.exclusions=tests/**,features/**,database/**
sonar.sourceEncoding=UTF-8

# Gerados pelo job "tests" do CI (PHPUnit)
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml

sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**
