# Manifestos Kubernetes do execution-service (Fase 4).
# Em EKS o deploy é feito pelo Terraform em infra/ (mesmos recursos, com
# valores reais de banco/fila/secret); estes YAMLs documentam a topologia e
# são validados no CI (kubeconform). Para aplicar manualmente:
#   kubectl apply -f k8s/
---
# Exemplo — valores reais vêm dos secrets do GitHub via Terraform (infra/).
apiVersion: v1
kind: Secret
metadata:
  name: execution-secret
  namespace: execution
type: Opaque
stringData:
  APP_KEY: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  NEWRELIC_LICENSE_KEY: "CHANGE_ME"
